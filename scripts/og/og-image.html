<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Funnel Display';
        src: url('../../node_modules/@fontsource-variable/funnel-display/files/funnel-display-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 300 800;
      }
      @font-face {
        font-family: 'Funnel Sans';
        src: url('../../node_modules/@fontsource-variable/funnel-sans/files/funnel-sans-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 300 800;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: grid;
        align-content: center;
        gap: 44px;
        padding: 0 72px;
        font-family: 'Funnel Sans', sans-serif;
        color: #1a1626;
        background: #f1eff2;
      }
      canvas {
        display: block;
        width: 100%;
      }
      .copy {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 40px;
      }
      h1 {
        font-family: 'Funnel Display', sans-serif;
        font-size: 52px;
        font-weight: 540;
        letter-spacing: -0.03em;
      }
      p {
        font-size: 24px;
        color: #5e566a;
      }
    </style>
    <script src="loom.js"></script>
  </head>
  <body>
    <canvas id="loom"></canvas>
    <div class="copy">
      <h1>Senior frontend freelance</h1>
      <p>Vue.js et TypeScript</p>
    </div>
    <script>
      weave(document.getElementById('loom'), {
        lines: ['Raphaël Di Rago'],
        cell: 5,
        colors: { warp: 'rgb(26 22 38 / 13%)', ground: 'rgb(26 22 38 / 6%)', figure: '#5b1a3a' },
      })
    </script>
  </body>
</html>
