<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <!--
    LinkedIn banner — 1584 × 396. The profile photo covers the bottom-left
    corner on desktop and the bottom centre on mobile, and mobile crops the
    sides: copy stays in the upper band, between x 400 and x 1404.
    `?guides` outlines those zones for checking.
  -->
  <style>
    @font-face {
      font-family: 'Funnel Display';
      src: url('../../node_modules/@fontsource-variable/funnel-display/files/funnel-display-latin-wght-normal.woff2') format('woff2');
      font-weight: 300 800;
    }

    @font-face {
      font-family: 'Funnel Sans';
      src: url('../../node_modules/@fontsource-variable/funnel-sans/files/funnel-sans-latin-wght-normal.woff2') format('woff2');
      font-weight: 300 800;
    }

    :root {
      --surface: #4a1430;
      --text: #faf9fb;
      --muted: #ecc2d6;
      --gold: #d4af4f;
    }

    * {
      margin: 0;
      box-sizing: border-box;
    }

    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      position: relative;
      font-family: 'Funnel Sans', sans-serif;
      color: var(--text);
      background: var(--surface);
    }

    /* ---- Pitch: promise, offer, proof --------------------------------------- */
    .pitch {
      position: absolute;
      left: 400px;
      top: 40px;
      width: 760px;
      display: grid;
      gap: 16px;
    }

    .promise {
      font-family: 'Funnel Display', sans-serif;
      font-size: 64px;
      font-weight: 560;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .offer {
      font-size: 23px;
      line-height: 1.3;
      color: var(--muted);
    }

    .proof {
      font-size: 19px;
      line-height: 1.4;
      color: var(--muted);
    }

    .proof strong {
      font-weight: 600;
      color: var(--text);
    }

    /* ---- Experience: the one gold figure ---------------------------------- */
    .experience {
      position: absolute;
      right: 180px;
      top: 36px;
      display: grid;
      justify-items: end;
    }

    .experience__figure {
      font-family: 'Funnel Display', sans-serif;
      font-size: 116px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--gold);
    }

    .experience__label {
      font-size: 28px;
      font-weight: 600;
      color: var(--muted);
    }

    /* ---- Contact ------------------------------------------------------------ */
    .site {
      position: absolute;
      right: 180px;
      bottom: 64px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--gold);
      font-size: 24px;
      font-weight: 600;
    }

    /* ---- ?guides: photo positions and mobile crop (approximate) ----------- */
    .guide {
      position: absolute;
      border: 2px dashed rgb(0 255 160 / 80%);
    }

    .guide--desktop-photo {
      left: 24px;
      top: 170px;
      width: 330px;
      height: 330px;
      border-radius: 50%;
    }

    .guide--mobile-photo {
      left: 652px;
      top: 230px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
    }

    .guide--mobile-crop {
      left: 158px;
      top: 0;
      width: 1268px;
      height: 396px;
    }
  </style>
</head>
<body>
<div class="pitch">
  <p class="promise">Votre frontend Vue.js,<br>robuste et prêt à évoluer.</p>
  <p class="offer">Freelance senior Vue.js et TypeScript, design systems.</p>
  <p class="proof">
    Ils m’ont fait confiance&nbsp;: <strong>Michelin, M6&nbsp;Web, Hackuity, Manager.one, Prismea, Auxo</strong>
  </p>
</div>
<p class="experience">
  <span class="experience__figure">10+</span>
  <span class="experience__label">YoE</span>
</p>
<p class="site">feniks.fr</p>
<script>
  if (location.search.includes('guides')) {
    for (const zone of ['desktop-photo', 'mobile-photo', 'mobile-crop']) {
      const guide = document.createElement('div')
      guide.className = `guide guide--${zone}`
      document.body.append(guide)
    }
  }
</script>
</body>
</html>
