name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two FTP uploads at the same time; queue them instead.
concurrency:
  group: deploy-ovh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & upload
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # Version read from the `packageManager` field of package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm lint
          pnpm lint:css

      - name: Build
        # Includes the type check (vue-tsc -b).
        run: pnpm build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to OVH (www/) over SFTP
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Encrypted transfer (OVH does not offer FTPS). Mirrors dist/ into www/:
          # uploads everything, removes remote files that are no longer built.
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "
            set net:max-retries 2;
            set net:timeout 20;
            mirror --reverse --delete --verbose --parallel=4 dist/ www/;
            quit
          "
