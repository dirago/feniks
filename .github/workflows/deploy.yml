name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two FTP uploads at the same time; queue them instead.
concurrency:
  group: deploy-ovh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & upload
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # Version read from the `packageManager` field of package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm lint
          pnpm lint:css

      - name: Build
        # Includes the type check (vue-tsc -b).
        run: pnpm build

      - name: Upload to OVH (www/)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # OVH shared hosting (Perso) does not implement FTPS (AUTH TLS): plain FTP only.
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./www/
          # Incremental sync: a state file on the server lists what was uploaded,
          # so only changed files are sent and stale hashed assets are removed.
          dangerous-clean-slate: false
